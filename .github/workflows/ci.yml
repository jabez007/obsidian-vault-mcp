name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm test

      # Plugin hosts install from Git and run the committed bundle.
      - name: Verify committed build and host versions
        run: |
          npm run build
          npm run sync-version
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Committed files are out of date. Run npm run build and npm run sync-version, then commit the result." >&2
            exit 1
          fi
